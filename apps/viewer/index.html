<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tensatory</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-title" content="Tensatory" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<canvas id="gpu"></canvas>
<canvas id="gl"></canvas>

<div id="left">
<div id="picker" class="panel">
  <div class="strip"><span class="title">bundle</span><span class="ticks"><button class="tickbtn" id="resetBtn" title="wipe local storage and reload">R</button><button class="tickbtn" id="logBtn" title="show console log">L</button><button class="tickbtn" id="uploadBtn" title="open a bundle JSON from disk (not persisted)">⤒</button><input type="file" id="pickFile" accept=".json,application/json" hidden></span></div>
  <div class="body">
    <div class="prow"><label data-tip="Which Tensatory data bundle to view; scroll or use ↑/↓ while hovering to switch.">bundle</label><select id="pickBundle"></select></div>
    <div class="psep"></div>
    <div class="prow"><label>about</label><div class="pval" id="pickAbout"></div></div>
    <div class="prow"><label data-tip="Which of the bundle's spaces (manifolds) to view: a 2D space gets the colorfield / isolines / streamlines panels, a 3D space the isosurface panels. Point sets and fields belong to a space. Only 2D and 3D spaces are listed. ?space=id">space</label><select id="pickSpaceSel"></select></div>
    <div class="prow"><label></label><div class="pval" id="pickSpace"></div></div>
    <div class="prow"><label data-tip="Where fields are sampled and geometry (isolines, streamlines) is computed. GPU results are asynchronous when rendered by the canvas, fully resident when rendered by the GPU. ?compute=cpu|gpu; ?check=1 logs CPU/GPU agreement.">compute</label><div id="computeBar" class="bar"></div></div>
    <div class="prow"><label data-tip="canvas: Canvas 2D. gpu: WebGPU raster and lines (points and labels stay on a canvas overlay). ?render=canvas|gpu">render</label><div id="renderBar" class="bar"></div></div>
    <div class="prow"><label>device</label><div class="pval" id="pickCompute"></div></div>
    <div class="prow" id="pickErrRow" style="display:none"><label>errors</label><div class="pval err" id="pickErr"></div></div>
  </div>
</div>

  <div class="panel" id="spacePanel"><div class="strip"><span class="title" id="spaceTitle">2D space</span></div><div class="body">
    <div class="row"><label>flags</label><span class="flags"><label class="tick on" for="showPoints" data-tip="The bundle's point sets: marked points (e.g. θ*) and ordered trajectories.">✓<input type="checkbox" id="showPoints" checked></label><span class="flag">points</span><label class="tick on" for="showBox" data-tip="The outline of the fields' box.">✓<input type="checkbox" id="showBox" checked></label><span class="flag">box</span></span></div>
    <div class="row d3"><label data-tip="The x range of the volume that is shown, as a fraction of the box. Drag the empty bar to create a range, drag a handle or the band to change it, click a handle to remove that end (one-sided), Backspace for the whole box. While dragging (or shift-hovering) only a dotted outline of the new box is shown; the surfaces are recomputed when you release. The isolines on the cut faces show where the isosurfaces meet them. ?cropx=lo,hi (null for an open end)">x</label><div class="isl" id="cropx" data-min="0" data-max="1" data-step="0.005" data-lo="null" data-hi="null"></div><span class="val" id="cropxv"></span></div>
    <div class="row d3"><label data-tip="The y range of the volume that is shown (see x).">y</label><div class="isl" id="cropy" data-min="0" data-max="1" data-step="0.005" data-lo="null" data-hi="null"></div><span class="val" id="cropyv"></span></div>
    <div class="row d3"><label data-tip="The z range of the volume that is shown (see x).">z</label><div class="isl" id="cropz" data-min="0" data-max="1" data-step="0.005" data-lo="null" data-hi="null"></div><span class="val" id="cropzv"></span></div>
    <div class="row"><label data-tip="Drag to pan, wheel to zoom, R to refit. flip x / flip y mirror the axes; cw / ccw rotate the view by a quarter turn.">view</label><div id="viewBar"><button class="tab" id="fit">fit</button><button class="tab d2" id="flipx">flip x</button><button class="tab d2" id="flipy">flip y</button><button class="tab d2" id="cw">cw</button><button class="tab d2" id="ccw">ccw</button></div></div>
  </div></div>

  <div class="panel d2"><div class="strip"><span class="title">colorfield</span><span class="ticks"><label class="tick on" for="showScalar" data-tip="Paint the C field as a colormapped raster.">✓<input type="checkbox" id="showScalar" checked></label></span></div><div class="body">
    <div class="row"><label data-tip="Grid resolution the fields are sampled on (longest side). Deselect for the field's own sample grid (symbolic fields fall back to 128).">resolution</label><div class="ds" id="res" data-values="16,32,64,128,256,512" data-value="" data-nullable></div><span class="val" id="resv"></span></div>
    <div class="row"><label>flags</label><span class="flags"><label class="tick on" for="smooth" data-tip="Interpolate between raster cells instead of showing them as blocks.">✓<input type="checkbox" id="smooth" checked></label><span class="flag">smooth</span></span></div>
  </div></div>

  <div class="panel" id="isoPanel"><div class="strip"><span class="title" id="isoTitle">isolines</span><span class="ticks"><div class="sl" id="isoRate" data-min="0" data-max="1" data-step="0.01" data-value="0.5" style="display:none"></div><label class="tick" for="isoAnim" data-tip="Animate the centre value; shift-click reverses the direction (◀). The slider to the left sets the cycle time (log scale: left 100 s, right 1 s, centre 10 s).">▶<input type="checkbox" id="isoAnim"></label><label class="tick on" for="showIso">✓<input type="checkbox" id="showIso" checked></label></span></div><div class="body">
    <div class="row"><label data-tip="Centre of the split, positioned in the I_V field's codomain (log-scaled / flipped as the field declares): the lines are spread evenly around this value, wrapping past the field's min and max.">value</label><div class="sl" id="isoValue" data-min="0" data-max="1" data-step="0.001" data-value="0.5"></div><span class="val"><span id="isoValuev"></span></span></div>
    <div class="row"><label data-tip="Number of isolines, evenly spaced and centred on 'value', wrapping past the field's min and max. Deselect for a single line at 'value'.">split</label><div class="ds" id="split" data-values="2,3,4,5,8,12" data-value="4" data-nullable></div><span class="val" id="splitv"></span></div>
    <div class="row"><label data-tip="Opacity of the isolines. Deselect for fully opaque.">opacity</label><div class="sl" id="isoAlpha" data-min="0" data-max="1" data-step="0.01" data-value="0.8" data-nullable></div><span class="val"><span id="isoAlphav"></span></span></div>
    <div class="row d3"><label>flags</label><span class="flags"><label class="tick on" for="isoExact" data-tip="Exact surfaces: every vertex is moved onto the true level set along the exact ∇f of a symbolic field (Newton, then bisection), and the normals are ∇f there — the 3D twin of the exact 2D isolines. Sampled fields stay on their grid. Off: linear marching-tetrahedra vertices.">✓<input type="checkbox" id="isoExact" checked></label><span class="flag">∇</span><label class="tick on" for="isoOutline" data-tip="Draw the isolines of the I_V field on the (cropped) box faces: where each isosurface meets the faces — the intersection is much easier to read from these outlines than from the shells alone.">✓<input type="checkbox" id="isoOutline" checked></label><span class="flag">outline</span></span></div>
    <div class="row d3"><label data-tip="Grid resolution the I_V field is sampled on for the isosurfaces (longest box side); marching tetrahedra on that grid.">resolution</label><div class="ds" id="res3" data-values="16,24,32,48,64,96" data-value="32"></div><span class="val" id="res3v"></span></div>
    <div class="row"><label class="h">smoothing</label></div>
    <div class="row"><label data-tip="Box-blur radius (cells) applied to the I_V field before contouring — a coarse-grained smoothing of the field (2D and 3D). Blurred fields are contoured on the grid (exact projection only applies to the unblurred symbolic field). Deselect for the raw field.">metric</label><div class="ds" id="metric" data-values="1,2,3,4" data-value="" data-nullable></div><span class="val" id="metricv"></span></div>
    <div class="row"><label id="lineLabel" data-tip="Taubin λ|μ iterations on grid-contoured polylines / surfaces (shape-preserving). Not applied to exact lines and surfaces, which are already on the true level set. In 3D the welded mesh is smoothed on the CPU (compute=gpu meshes fall back to the CPU while this is set). Deselect for raw geometry.">line</label><div class="ds" id="line" data-values="2,4,8,16" data-value="" data-nullable></div><span class="val" id="linev"></span></div>
    <!-- diagnostics line (method, vertex count, residual, timing); re-enable together with the isoInfo line in main.ts -->
    <!-- <div class="row"><span class="hint" id="isoInfo"></span></div> -->
  </div></div>

  <div class="panel d2" id="streamBox"><div class="strip"><span class="title">streamlines</span><span class="ticks"><label class="tick" for="anim" data-tip="Advance the particles along the lines; off freezes them at the current phase (like pausing). Shift-click reverses the playback: ◀ runs the particles backward along the same lines. Whether the lines follow the S∇ field or its inverse is the 'dir' row below, not this.">▶<input type="checkbox" id="anim"></label><label class="tick on" for="showStream">✓<input type="checkbox" id="showStream" checked></label></span></div><div class="body">
    <div class="row"><label data-tip="Integrate each path following the S∇ field (ascending; for a gradient: ascent) or its inverse (descending). This is which lines get drawn, not how the particles play (that is ▶/◀): with a converging field, descending lines drain into the sinks — a different set of lines than ascending ones played backwards. ?sdir=ascending|descending">dir</label><div class="ch" id="sdir" data-options="ascending,descending" data-value="descending" data-tips="follow the field|run against the field"></div><span class="val"></span></div>
    <div class="row"><label data-tip="How the seeds are placed and oversampling is handled. strat: one jittered seed per cell of a grid of 'lines' cells, each line starts at its seed and runs 'length' steps in the 'dir' direction — lines pile up where the field converges. bi-strat: the same seeds integrated both ways, so the line passes through its seed (its backward half runs against 'dir'). JL: evenly spaced (Jobard–Lefer) — seeds are placed one separation d beside existing lines and a line stops within d/2 of another; 'lines' sets the density (d = the cell side of that many cells); planned on the CPU once per field / grid. cover: strat, then seeds added in cells that lines rarely cross (two rounds). ?smode=bi-strat|strat|JL|cover">mode</label><div class="ch" id="smode" data-options="bi-strat,strat,JL,cover" data-value="strat" data-tips="stratified seeds, lines integrated both ways through their seeds|stratified seeds, lines start at their seeds|evenly spaced (Jobard–Lefer): uniform density|stratified plus seeds in starved cells"></div><span class="val"></span></div>
    <div class="row"><label data-tip="Number of streamlines. One seed is placed at random in each of that many equal cells of the box (strat / coverage), or the density of the evenly-spaced lines (JL: the separation is the side of one of that many cells). Deselect for no lines.">lines</label><div class="ds" id="lines" data-values="200,500,1000,2000,5000,10000" data-value="1000" data-nullable></div><span class="val" id="linesv"></span></div>
    <div class="row"><label data-tip="Maximum integration steps per streamline (½ cell per step; in each direction for bi-strat). Except in bi-strat a line starts at its seed and runs in the 'dir' direction only, so line starts stay as spread out as the seeds and lines only bunch up where the flow converges.">length</label><div class="sl" id="slen" data-min="25" data-max="400" data-step="5" data-value="100"></div><span class="val" id="slenv"></span></div>
    <div class="row"><label data-tip="Opacity of the streamlines. Deselect for fully opaque.">opacity</label><div class="sl" id="sAlpha" data-min="0" data-max="1" data-step="0.01" data-value="0.9" data-nullable></div><span class="val"><span id="sAlphav"></span></span></div>
    <div class="row"><label data-tip="Length of each particle's tail, in cells. Each streamline is one particle with this tail (transparent tail, full-colour head); ▶ slides it along the flow. Deselect for solid, full-length lines (no particles).">tail</label><div class="ds" id="tail" data-values="1,2,5,10,25" data-value="5" data-nullable></div><span class="val" id="tailv"></span></div>
    <div class="row"><label data-tip="Number of particles per streamline, evenly spaced along its length and advancing in lockstep. Deselect for a single particle.">split</label><div class="ds" id="ssplit" data-values="2,3,4,5,8,12" data-value="8" data-nullable></div><span class="val" id="ssplitv"></span></div>
  </div></div>
</div>


<div id="cursorPane" class="panel"><div class="body mono" id="cursor"></div></div>
<div id="info"></div>
<div id="metrics" class="panel"><div class="strip"><span class="title">mappings</span></div><div class="body" id="metricSvgBody"></div></div>
<div id="help">drag: pan<br>wheel: zoom<br>R: refit<br>space: pause animations<br>shift-hover: preview sliders and metrics</div>
<div id="status">loading…</div>
<div id="tip"></div>
<div id="logModal"><div class="logbox"><div class="loghead"><span>console</span><button id="logClose">✕</button></div><pre id="logText"></pre></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
